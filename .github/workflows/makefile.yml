name: Build anogskiller (Ubuntu)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang libssl-dev libplist-dev libxml2-dev zip
          
          # تحميل ldid
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Install Theos & Toolchain
        run: |
          # 1. حذف أي مجلد سابق لضمان بيئة نظيفة
          rm -rf $THEOS
          
          # 2. استنساخ Theos أولاً
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 3. إنشاء مجلدات الـ SDKs والـ Toolchain بعد الاستنساخ
          mkdir -p $THEOS/sdks
          mkdir -p $THEOS/toolchain
          
          # 4. استنساخ الـ SDKs
          git clone --depth 1 https://github.com/theos/sdks /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS*.sdk $THEOS/sdks/ || true
          
          # 5. تحميل الـ Linux Toolchain برابط مباشر ومضمون
          curl -L -o /tmp/linux-toolchain.tar.xz https://github.com/theos/toolchain/releases/download/v2.5/linux-toolchain.tar.xz
          tar -xf /tmp/linux-toolchain.tar.xz -C $THEOS/toolchain
          
          # 6. إضافة المسارات للنظام
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_PATH

      - name: Build LiteHook
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          git clone --depth 1 https://github.com/opa334/litehook /tmp/litehook
          cd /tmp/litehook
          make FINALPACKAGE=1
          
          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/lib"
          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/include"
          cp include/*.h "$GITHUB_WORKSPACE/vendor/litehook/include/" 2>/dev/null || find . -name "litehook.h" -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/include/" \;
          find . -name "*.a" -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/lib/" \;

      - name: Build Tweak
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          make clean || true
          make FINALPACKAGE=1

      - name: Locate and Sign dylib
        run: |
          DYLIB=$(find .theos/obj -name "anogskiller.dylib" | head -1)
          if [ -z "$DYLIB" ]; then 
            echo "No dylib found!"
            exit 1
          fi
          ldid -Sentitlements.plist "$DYLIB"
          mkdir -p out
          cp "$DYLIB" out/anogskiller.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anogskiller-dylib
          path: out/anogskiller.dylib
          if-no-files-found: error
