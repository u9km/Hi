name: Build anogskiller (Ubuntu)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang libssl-dev libplist-dev libxml2-dev zip xz-utils

      - name: Install ldid
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install ldid-procursus
          sudo ln -sf /home/linuxbrew/.linuxbrew/bin/ldid /usr/local/bin/ldid
          command -v ldid

      - name: Install Theos
        run: |
          rm -rf "$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls "$THEOS/toolchain" "$THEOS/sdks"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Vendor LiteHook sources
        run: |
          # litehook ships no root Makefile — it's meant to be compiled
          # directly as part of the consuming project, not built as a
          # standalone static library. So we just copy its sources in.
          git clone --depth 1 https://github.com/opa334/litehook /tmp/litehook

          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/include"
          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/src"

          find /tmp/litehook -name "*.h" -not -path "*/Tests/*" \
            -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/include/" \;

          find /tmp/litehook/src -name "*.c" \
            -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/src/" \;
          find /tmp/litehook/src -name "*.m" \
            -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/src/" \; 2>/dev/null || true

          echo "== headers =="
          ls -la "$GITHUB_WORKSPACE/vendor/litehook/include"
          echo "== sources =="
          ls -la "$GITHUB_WORKSPACE/vendor/litehook/src"

      - name: Build Tweak
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          make clean || true
          make FINALPACKAGE=1

      - name: Locate and Sign dylib
        run: |
          DYLIB=$(find .theos/obj -name "anogskiller.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "No dylib found!"
            exit 1
          fi
          ldid -Sentitlements.plist "$DYLIB"
          mkdir -p out
          cp "$DYLIB" out/anogskiller.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anogskiller-dylib
          path: out/anogskiller.dylib
          if-no-files-found: error
