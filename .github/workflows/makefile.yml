name: Build anogskiller (Ubuntu)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang libssl-dev libplist-dev libxml2-dev zip
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      # استخدام إجراء جاهز لتثبيت Theos والأدوات تلقائياً
      - name: Install Theos & Toolchain
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Build LiteHook
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          git clone --depth 1 https://github.com/opa334/litehook /tmp/litehook
          cd /tmp/litehook
          make FINALPACKAGE=1
          
          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/lib"
          mkdir -p "$GITHUB_WORKSPACE/vendor/litehook/include"
          cp include/*.h "$GITHUB_WORKSPACE/vendor/litehook/include/" 2>/dev/null || find . -name "litehook.h" -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/include/" \;
          find . -name "*.a" -exec cp {} "$GITHUB_WORKSPACE/vendor/litehook/lib/" \;

      - name: Build Tweak
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          make clean || true
          make FINALPACKAGE=1

      - name: Locate and Sign dylib
        run: |
          DYLIB=$(find .theos/obj -name "anogskiller.dylib" | head -1)
          if [ -z "$DYLIB" ]; then 
            echo "No dylib found!"
            exit 1
          fi
          ldid -Sentitlements.plist "$DYLIB"
          mkdir -p out
          cp "$DYLIB" out/anogskiller.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anogskiller-dylib
          path: out/anogskiller.dylib
          if-no-files-found: error
